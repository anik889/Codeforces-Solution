name: Update Performance Dashboard

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes — catches contest submits fast
  workflow_dispatch:          # manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run dashboard updater
        run: python update_dashboard.py

      - name: Commit & push if README changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes." || (
            git commit -m "chore: update performance dashboard [skip ci]" &&
            git push
          )
