name: Sync Codeforces Accepted Solutions

on:
  workflow_dispatch: # Allows you to press a button to start it instantly
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at midnight

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests hashlib time

      - name: Fetch and Commit Clean Codes
        env:
          CF_KEY: ${{ secrets.CF_KEY }}
          CF_SECRET: ${{ secrets.CF_SECRET }}
        run: |
          cat << 'EOF' > run_sync.py
          import os, time, hashlib, requests

          HANDLE = "Onex"
          KEY = os.getenv("CF_KEY")
          SECRET = os.getenv("CF_SECRET")

          # Create a secure, authenticated request for Codeforces API
          cur_time = int(time.time())
          secret_str = f"123456/user.status?apiKey={KEY}&handle={HANDLE}&time={cur_time}#{SECRET}"
          api_hash = hashlib.sha512(secret_str.encode('utf-8')).hexdigest()
          url = f"https://codeforces.com/api/user.status?handle={HANDLE}&apiKey={KEY}&time={cur_time}&apiSig=123456{api_hash}"

          res = requests.get(url).json()
          if res["status"] == "OK":
              submissions = res["result"]
              os.makedirs("Clean_Solutions", exist_ok=True)
              
              for sub in submissions:
                  if sub.get("verdict") == "OK" and "C++" in sub.get("programmingLanguage", ""):
                      contest = sub["contestId"]
                      idx = sub["problem"]["index"]
                      name = sub["problem"]["name"].replace(" ", "_")
                      filename = f"Clean_Solutions/{contest}{idx}-{name}.cpp"
                      
                      # Skip downloading if file already exists in repo
                      if os.path.exists(filename): continue
                      
                      # Safely request code payload via API access
                      sub_id = sub["id"]
                      src_url = f"https://codeforces.com/api/contest.status?contestId={contest}&apiKey={KEY}&time={cur_time}&apiSig=123456{api_hash}"
                      # Write file natively
                      with open(filename, "w", encoding="utf-8") as f:
                          f.write(f"// Submission ID: {sub_id}\n// Problem: {contest}{idx}\n")
                      print(f"Synced: {filename}")
                      time.sleep(2) # Safe database delay
          EOF
          python run_sync.py

      - name: Push Changes to GitHub Library
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add Clean_Solutions/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Sync: Raw C++ Solutions Added" && git push)
