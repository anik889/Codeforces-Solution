name: Sync Codeforces Accepted Solutions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch and Commit Clean Codes
        env:
          CF_KEY: ${{ secrets.CF_KEY }}
          CF_SECRET: ${{ secrets.CF_SECRET }}
        run: |
          cat << 'EOF' > run_sync.py
          import os, time, hashlib, requests

          HANDLE = "Onex"
          KEY = os.getenv("CF_KEY")
          SECRET = os.getenv("CF_SECRET")

          if not KEY or not SECRET:
              print("Missing Codeforces API Keys in GitHub Secrets!")
              exit(1)

          def get_cf_signature(method_name, params):
              cur_time = int(time.time())
              # Codeforces API requires params to be sorted alphabetically for hashing
              sorted_params = "&".join([f"{k}={v}" for k, v in sorted(params.items())])
              secret_str = f"123456/{method_name}?{sorted_params}&apiKey={KEY}&time={cur_time}#{SECRET}"
              api_hash = hashlib.sha512(secret_str.encode('utf-8')).hexdigest()
              return f"&apiKey={KEY}&time={cur_time}&apiSig=123456{api_hash}"

          # 1. Fetch user submissions
          sub_params = {"handle": HANDLE}
          sig = get_cf_signature("user.status", sub_params)
          url = f"https://codeforces.com/api/user.status?handle={HANDLE}{sig}"
          
          try:
              res = requests.get(url).json()
              if res["status"] != "OK":
                  print(f"API Error: {res.get('comment')}")
                  exit(1)
                  
              submissions = res["result"]
              os.makedirs("Clean_Solutions", exist_ok=True)
              
              # Filter latest unique AC submissions
              accepted_dict = {}
              for sub in submissions:
                  if sub.get("verdict") == "OK" and "C++" in sub.get("programmingLanguage", ""):
                      prob = sub["problem"]
                      prob_id = f"{prob.get('contestId')}{prob.get('index')}"
                      if prob_id not in accepted_dict:
                          accepted_dict[prob_id] = sub
                          
              print(f"Found {len(accepted_dict)} unique solutions to process.")

              # 2. Grab raw code via authenticated contest status API
              for sub_id, sub in accepted_dict.items():
                  contest = sub["contestId"]
                  idx = sub["problem"]["index"]
                  name = sub["problem"]["name"].replace(" ", "_")
                  filename = f"Clean_Solutions/{contest}zx-{name}.cpp".replace("zx", idx)
                  
                  if os.path.exists(filename):
                      continue

                  # Authenticated request to get full contest submission details (includes source code)
                  status_params = {"contestId": str(contest), "asManager": "false"}
                  c_sig = get_cf_signature("contest.status", status_params)
                  status_url = f"https://codeforces.com/api/contest.status?contestId={contest}&asManager=false{c_sig}"
                  
                  c_res = requests.get(status_url).json()
                  if c_res["status"] == "OK":
                      for remote_sub in c_res["result"]:
                          if remote_sub["id"] == sub["id"] and "source" in remote_sub:
                              with open(filename, "w", encoding="utf-8") as f:
                                  f.write(remote_sub["source"])
                              print(f"Saved: {filename}")
                              time.sleep(1.5)
                              break
          except Exception as e:
              print(f"Error during runtime: {e}")
          EOF
          python run_sync.py

      - name: Push Changes to GitHub Library
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add Clean_Solutions/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Sync: Raw C++ Solutions Added" && git push)
