name: Sync Codeforces Accepted Solutions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch and Commit Clean Codes
        env:
          CF_KEY: ${{ secrets.CF_KEY }}
          CF_SECRET: ${{ secrets.CF_SECRET }}
        run: |
          cat << 'EOF' > run_sync.py
          import os, time, hashlib, requests
          from bs4 import BeautifulSoup

          HANDLE = "Onex"
          
          # Fetch public user submissions via status API
          url = f"https://codeforces.com/api/user.status?handle={HANDLE}"
          
          try:
              res = requests.get(url).json()
              if res["status"] == "OK":
                  submissions = res["result"]
                  os.makedirs("Clean_Solutions", exist_ok=True)
                  
                  accepted_dict = {}
                  for sub in submissions:
                      if sub.get("verdict") == "OK" and "C++" in sub.get("programmingLanguage", ""):
                          prob = sub["problem"]
                          prob_id = f"{prob.get('contestId')}{prob.get('index')}"
                          if prob_id not in accepted_dict:
                              accepted_dict[prob_id] = sub
                  
                  print(f"Found {len(accepted_dict)} unique solutions to sync.")
                  
                  for sub in list(accepted_dict.values()):
                      contest = sub["contestId"]
                      idx = sub["problem"]["index"]
                      sub_id = sub["id"]
                      name = sub["problem"]["name"].replace(" ", "_")
                      filename = f"Clean_Solutions/{contest}{idx}-{name}.cpp"
                      
                      if os.path.exists(filename): 
                          continue
                          
                      # Directly scrape the submission page raw code block natively inside the cloud
                      sub_url = f"https://codeforces.com/contest/{contest}/submission/{sub_id}"
                      page = requests.get(sub_url, headers={"User-Agent": "Mozilla/5.0"})
                      
                      if page.status_code == 200:
                          soup = BeautifulSoup(page.text, "html.parser")
                          code_block = soup.find("pre", id="program-source-text")
                          if code_block:
                              with open(filename, "w", encoding="utf-8") as f:
                                  f.write(code_block.text)
                              print(f"Successfully saved: {filename}")
                              time.sleep(2.5) # Protect against Codeforces rate blocking
          except Exception as e:
              print(f"Execution Error: {e}")
          EOF
          python run_sync.py

      - name: Push Changes to GitHub Library
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add Clean_Solutions/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Sync: Raw C++ Solutions Added" && git push)
